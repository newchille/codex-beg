name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: |
          pnpm typecheck
          pnpm test
          pnpm lint
          pnpm build
          git diff --check

      - name: Generate supported macOS icon
        run: pnpm --filter @codex-beg/desktop package:icon

      - name: Build arm64 DMG
        run: pnpm package:dmg

      - name: Verify packaged artifact
        shell: bash
        run: |
          set -euo pipefail
          app="apps/desktop/release/mac-arm64/Codex BEG.app"
          dmg="apps/desktop/release/Codex-BEG-${GITHUB_REF_NAME#v}-mac-arm64.dmg"
          test -f "$dmg"
          test -f "$app/Contents/Resources/agent-host/main.js"
          file "$app/Contents/MacOS/Codex BEG" | grep -q 'arm64'
          codesign --verify --deep --strict --verbose=2 "$app"
          plutil -p "$app/Contents/Info.plist" | grep -q 'CFBundleIconFile'
          test -f "$app/Contents/Resources/icon.icns"
          test "$(shasum -a 256 apps/agent-host/dist/main.js | awk '{print $1}')" = "$(shasum -a 256 "$app/Contents/Resources/agent-host/main.js" | awk '{print $1}')"
          mkdir -p release-assets
          cp "$dmg" release-assets/
          (cd release-assets && shasum -a 256 "$(basename "$dmg")" > SHA256SUMS.txt)

      - name: Publish ad-hoc signed release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Codex BEG ${{ github.ref_name }} for Apple Silicon macOS.

            This build is ad-hoc signed at the complete bundle level but is not Developer ID signed or notarized. macOS may require the normal Open Anyway confirmation. The official external `tunnel-client` prerequisite is not bundled.
          files: |
            release-assets/Codex-BEG-*-mac-arm64.dmg
            release-assets/SHA256SUMS.txt
